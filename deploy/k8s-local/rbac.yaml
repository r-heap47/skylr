apiVersion: v1
kind: ServiceAccount
metadata:
  name: skylr-overseer
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: skylr-overseer
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "delete", "get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: skylr-overseer
  namespace: default
subjects:
  - kind: ServiceAccount
    name: skylr-overseer
    namespace: default
roleRef:
  kind: Role
  name: skylr-overseer
  apiGroup: rbac.authorization.k8s.io
