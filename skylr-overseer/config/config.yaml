grpc:
  host: "0.0.0.0"
  port: "9000"

overseer:
  check_for_shard_failures_delay: "1s"
  observer_delay: "1s"
  observer_metrics_timeout: "5s"
  observer_error_threshold: 3
  virtual_nodes_per_shard: 150
  log_storage_on_metrics: false

provisioner:
  type: process
  process:
    binary_path: "../skylr-shard/bin/skylr-shard"
    config_path: "../skylr-shard/config/config.yaml"
    overseer_address: "127.0.0.1:9000"
    grpc_host: "localhost"
    grpc_port_min: 5000
    grpc_port_max: 5999
    max_shards: 5
    initial_shards: 1
    registration_timeout: "5s"
    post_registration_delay: "1s"
  kubernetes:
    kubeconfig: ""           # empty = in-cluster auth; or path to ~/.kube/config
    namespace: "default"
    image: "skylr-shard:latest"
    overseer_address: "skylr-overseer.default.svc.cluster.local:9000"
    grpc_port: 5000
    gateway_port: 5001
    max_shards: 10
    initial_shards: 3
    registration_timeout: "30s"
    post_registration_delay: "2s"
    resources:
      cpu_request: "100m"
      cpu_limit: "500m"
      memory_request: "64Mi"
      memory_limit: "256Mi"

autoscaler:
  enabled: true
  eval_interval: "1s"
  cooldown: "5s"
  sustained_for: 3
  rules:
    item_count:
      enabled: true
      threshold: 100
